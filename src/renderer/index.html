<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <title>Voicer</title>
  <link rel="stylesheet" href="./pill.css" />
</head>
<body>
  <div id="app" data-state="idle">
    <div id="capsule">
      <div id="tools">
        <button id="mic" aria-label="Talk to Voicer">
          <svg id="glyph" viewBox="0 0 24 24" aria-hidden="true">
            <rect class="fill" x="9" y="2.5" width="6" height="11" rx="3" />
            <path class="stroke" d="M5.5 11a6.5 6.5 0 0 0 13 0" />
            <path class="stroke" d="M12 17.5v4" />
          </svg>
          <svg id="alert" viewBox="0 0 24 24" aria-hidden="true">
            <path class="stroke" d="M12 5.5v9" />
            <circle class="fill" cx="12" cy="19" r="1.4" />
          </svg>
        </button>
        <button id="type" aria-label="Type a prompt instead">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect class="thin" x="2.5" y="6.5" width="19" height="11" rx="2.5" />
            <path class="thin" d="M8.5 14.5h7" />
            <circle class="fill" cx="7" cy="10.5" r="1" />
            <circle class="fill" cx="10.3" cy="10.5" r="1" />
            <circle class="fill" cx="13.7" cy="10.5" r="1" />
            <circle class="fill" cx="17" cy="10.5" r="1" />
          </svg>
        </button>
        <button id="stats" aria-label="Tokens and cost">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect class="fill" x="4" y="13" width="3.4" height="7" rx="1.2" />
            <rect class="fill" x="10.3" y="8.5" width="3.4" height="11.5" rx="1.2" />
            <rect class="fill" x="16.6" y="4" width="3.4" height="16" rx="1.2" />
          </svg>
        </button>
        <button id="gear" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="fill" fill-rule="evenodd" d="M19.14 12.94c.04-.31.06-.62.06-.94
              s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.61l-1.92-3.32a.5.5 0 0 0-.59-.22
              l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.49-.41h-3.84
              a.5.5 0 0 0-.49.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96
              a.5.5 0 0 0-.59.22L2.74 8.87a.5.5 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94
              s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.61l1.92 3.32c.12.22.38.3.59.22
              l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.04.24.25.41.49.41h3.84
              c.24 0 .45-.17.49-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96
              c.22.08.47 0 .59-.22l1.92-3.32a.5.5 0 0 0-.12-.61l-2.03-1.58z
              M12 15.6A3.6 3.6 0 1 1 15.6 12 3.6 3.6 0 0 1 12 15.6z" />
          </svg>
        </button>
        <button id="quit" aria-label="Quit Voicer">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="stroke" d="M6.5 6.5l11 11" />
            <path class="stroke" d="M17.5 6.5l-11 11" />
          </svg>
        </button>
      </div>
      <span id="meter"><i></i><i></i><i></i><i></i><i></i></span>
      <span id="heard"></span>
      <button id="stop" hidden>STOP</button>
    </div>
    <div id="status"></div>
    <div id="compose" hidden>
      <textarea id="prompt" rows="1" spellcheck="false"
                placeholder="Type a prompt — Enter to send, Esc to close"></textarea>
    </div>
    <div id="usage" hidden></div>
    <div id="settings" hidden>
      <h3>Position</h3>
      <div id="align-grid" role="radiogroup" aria-label="Where the capsule sits">
        <button data-align="top-left" aria-label="Top left"></button>
        <button data-align="top" aria-label="Top centre"></button>
        <button data-align="top-right" aria-label="Top right"></button>
        <button data-align="left" aria-label="Left"></button>
        <span class="screen">screen</span>
        <button data-align="right" aria-label="Right"></button>
        <button data-align="bottom-left" aria-label="Bottom left"></button>
        <button data-align="bottom" aria-label="Bottom centre"></button>
        <button data-align="bottom-right" aria-label="Bottom right"></button>
      </div>
      <label class="row check">
        <input type="checkbox" id="set-automove" />
        <span>Move aside when I need to click underneath</span>
      </label>

      <h3>Listening</h3>
      <label class="row">
        <span>Stop after a pause of</span>
        <span class="field"><input type="number" id="set-silence" min="0" max="10000" step="250" /> ms</span>
      </label>

      <h3>Voice</h3>
      <label class="row">
        <span>Speak with</span>
        <span class="field"><select id="set-backend">
          <option value="apple">Apple (offline)</option>
          <option value="fish">Fish Audio</option>
        </select></span>
      </label>
      <label class="row">
        <span>Fish API key</span>
        <span class="field"><input type="password" id="set-fishkey" placeholder="none" /></span>
      </label>
      <label class="row">
        <span>Fish voice ID</span>
        <span class="field"><input type="text" id="set-voiceid" placeholder="default" /></span>
      </label>

      <h3>Screenshots</h3>
      <label class="row">
        <span>Longest edge</span>
        <span class="field"><input type="number" id="set-maxedge" min="320" max="4096" step="64" /> px</span>
      </label>
      <label class="row">
        <span>JPEG quality</span>
        <span class="field"><input type="number" id="set-quality" min="10" max="100" step="5" /> %</span>
      </label>

      <h3>Advanced</h3>
      <label class="row">
        <span>Kill hotkey</span>
        <span class="field"><input type="text" id="set-hotkey" placeholder="Alt+Command+." /></span>
      </label>
      <label class="row">
        <span>Claude Code path</span>
        <span class="field"><input type="text" id="set-claudepath" placeholder="found automatically" /></span>
      </label>
      <label class="row">
        <span>Agent works in</span>
        <span class="field"><input type="text" id="set-agentcwd" placeholder="home directory" /></span>
      </label>

      <footer>
        <span id="settings-note"></span>
        <button id="settings-save">Save</button>
      </footer>
    </div>
    <div id="card" hidden>
      <button id="dismiss" aria-label="Dismiss this answer">&times;</button>
      <p id="answer"></p>
    </div>
  </div>
  <script type="module" src="./pill.ts"></script>
</body>
</html>
